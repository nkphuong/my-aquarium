<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aquarist Manager - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#22d3ee",
                        "background-light": "#ecfeff",
                        "background-dark": "#0b1121",
                        "surface-light": "#ffffff",
                        "surface-dark": "#151e32",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0f172a] dark:text-white transition-colors duration-300">
<div class="relative flex h-screen w-full overflow-hidden">
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-br from-background-light/90 to-background-light dark:from-background-dark/90 dark:to-background-dark z-10"></div>
<div class="w-full h-full bg-cover bg-center" data-alt="Deep blue underwater scene with light rays and floating particles" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCyUqRTFl-E2nhNYtmq2dTNIyX6yjVRnp_s-5_SAEB-ujsRd7u1PcOlOmq1ZayEj0Qo4ucQXkjESIFsBaOs9YEwSqStlzvc1eFke-eUjosv42sjB-UgS62rO0kMtYFlqqjvT7s291TPhb4sq77XYq1INhZ7P3pUzFTxQibeDl6W3ew2Cd-Z2Jalf7J6M7lL1dEHW8quC3wcZM16irwkCOma-bN5hrlSoivr_z7fxhjthp-CRCQpotbC9qoa3VOun5eEbL9Dwyae_Mw"); filter: blur(4px);'>
</div>
</div>
<div class="relative z-10 flex w-full h-full flex-col">
<header class="flex items-center justify-between px-6 py-4 lg:px-10">
<div class="flex items-center gap-3 cursor-pointer">
<div class="flex items-center justify-center size-10 rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined" style="font-size: 24px;">water_drop</span>
</div>
<h2 class="text-xl font-bold tracking-tight">Aquarist Manager</h2>
</div>
<div class="hidden sm:flex gap-4">
<span class="text-sm font-medium opacity-70 self-center">Don't have an account?</span>
<a class="text-sm font-bold text-primary hover:underline self-center" href="#">Sign Up</a>
</div>
</header>
<main class="flex-1 flex items-center justify-center px-4 py-8">
<div class="w-full max-w-[480px] rounded-lg bg-surface-light/80 dark:bg-surface-dark/60 backdrop-blur-xl border border-[#e5e7eb] dark:border-[#1e293b] shadow-2xl overflow-hidden animate-fade-in-up">
<div class="p-8 md:p-10 flex flex-col gap-6">
<div class="text-center flex flex-col items-center gap-2 mb-2">
<div class="size-12 rounded-full bg-primary flex items-center justify-center mb-2 shadow-[0_0_15px_rgba(34,211,238,0.4)]">
<span class="material-symbols-outlined text-[#0b1121]" style="font-size: 28px;">waves</span>
</div>
<h1 class="text-3xl font-bold tracking-tight">Dive Back In</h1>
<p class="text-sm text-[#64748b] dark:text-[#94a3b8] font-body">
                                Enter your credentials to access your tanks.
                            </p>
</div>
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="text-sm font-medium ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#94a3b8]" style="font-size: 20px;">mail</span>
</div>
<input class="w-full h-12 pl-11 pr-4 rounded-full bg-white dark:bg-[#0b1121] border border-[#e5e7eb] dark:border-[#334155] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-[#94a3b8] text-sm font-body" id="email" placeholder="user@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-medium" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#94a3b8]" style="font-size: 20px;">lock</span>
</div>
<input class="w-full h-12 pl-11 pr-4 rounded-full bg-white dark:bg-[#0b1121] border border-[#e5e7eb] dark:border-[#334155] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-[#94a3b8] text-sm font-body" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full h-12 mt-2 rounded-full bg-primary hover:bg-[#06b6d4] text-[#0f172a] font-bold text-base tracking-wide shadow-lg shadow-primary/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 group">
<span>Log In</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#e5e7eb] dark:border-[#1e293b]"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface-light dark:bg-[#151e32] px-4 text-xs uppercase tracking-wider text-[#94a3b8]">Or continue with</span>
</div>
</div>
<div class="flex justify-center gap-4">
<button aria-label="Sign in with Google" class="size-12 rounded-full bg-white dark:bg-[#151e32] border border-[#e5e7eb] dark:border-[#334155] flex items-center justify-center hover:bg-gray-50 dark:hover:bg-[#1e293b] transition-colors">
<img alt="Google Logo" class="size-5" data-alt="Google G colorful logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOmGrwc1BynBva6SkprGFei0Mvps3l7C1f7Z2qpQrf3xw7OZFMAUKIzHk7samYeD19agIfZYq_4iAjm-9wDWzoi9Vmg9VNLNSkgPcrONJyrY0PO1vLAEKb_yt5RY_A5CUrYizWZ9HqNBCl73kkWpSdoJ6SfqKZhrcsVXCCHhmKulcypv55OfaolnZomhMRLLIuaKPblkygsOFM35ld8ApdMRCutXq3vahyAa_6t3C_u3vEVfzLpnqsL_oqo61tXJvz4EYC_dtMnVk"/>
</button>
<button aria-label="Sign in with Apple" class="size-12 rounded-full bg-white dark:bg-[#151e32] border border-[#e5e7eb] dark:border-[#334155] flex items-center justify-center hover:bg-gray-50 dark:hover:bg-[#1e293b] transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">ios</span>
</button>
</div>
</div>
<div class="p-4 bg-primary/10 dark:bg-[#020617] text-center sm:hidden">
<p class="text-sm">Don't have an account? <a class="font-bold text-primary" href="#">Sign Up</a></p>
</div>
</div>
</main>
<footer class="py-6 text-center text-xs text-[#94a3b8]">
<p>© 2024 Aquarist Manager. All rights reserved.</p>
</footer>
</div>
</div>
<style>::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1121; 
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155; 
        }@keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out forwards;
        }
    </style>
</body></html>
